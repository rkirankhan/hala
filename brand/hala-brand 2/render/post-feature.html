<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="post.css">
<style>
  h1.display { font-size: 88px; margin: 40px 0 34px; max-width: 13ch; }
  p.sub { font-size: 32px; max-width: 26ch; }
  .middle { margin: auto 0; }
  .rows { display: flex; flex-direction: column; gap: 18px; margin-top: 52px; }
  .row { display: flex; align-items: center; gap: 18px; }
  .row .step { border: 1px solid var(--line); border-radius: 16px; background: rgba(20,20,24,0.85); padding: 20px 28px; font-size: 25px; color: #E8E8EA; }
  .row .arrow { color: var(--faint); font-size: 28px; }
</style></head>
<body>
<div class="frame">
  <div class="head">
    <svg class="mark" width="60" height="60" viewBox="0 0 64 64"><circle cx="32" cy="32" r="20" fill="none" stroke="#6E7BF2" stroke-width="6" stroke-linecap="round" stroke-dasharray="94 31" transform="rotate(135 32 32)"/><circle cx="17.9" cy="46.1" r="6.5" fill="#3ECF8E"/></svg>
    <div class="word">Hala</div>
  </div>
  <div class="middle">
    <div class="eyebrow">In the background</div>
    <h1 class="display">The follow-up nobody ever gets round to.</h1>
    <div class="rows">
      <div class="row"><span class="step">Call missed</span><span class="arrow">→</span><span class="step">Text within 60s</span><span class="arrow">→</span><span class="step" style="border-color: rgba(62,207,142,0.4); color:#3ECF8E;">Booking link</span></div>
      <div class="row"><span class="step">No reply 24h</span><span class="arrow">→</span><span class="step">WhatsApp nudge</span><span class="arrow">→</span><span class="step" style="border-color: rgba(62,207,142,0.4); color:#3ECF8E;">Rebooked</span></div>
    </div>
  </div>
  <div class="foot">
    <div class="tag">Done every single time</div>
    <div class="url">hala.khaashub.com</div>
  </div>
</div>
</body></html>
