<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="post.css">
<style>
  .frame { width: 1584px; height: 396px; padding: 0 90px; flex-direction: row; align-items: center; }
  .word { font-family: var(--display); font-weight: 700; font-size: 76px; letter-spacing: var(--tr-ui); color: #fff; }
  .tagline { font-family: var(--display); font-weight: 500; font-size: 33px; letter-spacing: var(--tr-heading); color: var(--muted); margin-top: 12px; max-width: 950px; }
  .tagline .accent { color: #9AA3F7; }
</style></head>
<body>
<div class="frame">
  <svg class="ghost-ring" style="right:-200px; top:-260px; opacity:0.06;" width="720" height="720" viewBox="0 0 64 64"><circle cx="32" cy="32" r="20" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-dasharray="94 31" transform="rotate(135 32 32)"/></svg>
  <div style="display:flex; align-items:center; gap:36px;">
    <svg class="mark" width="120" height="120" viewBox="0 0 64 64"><circle cx="32" cy="32" r="20" fill="none" stroke="#6E7BF2" stroke-width="6" stroke-linecap="round" stroke-dasharray="94 31" transform="rotate(135 32 32)"/><circle cx="17.9" cy="46.1" r="6.5" fill="#3ECF8E"/></svg>
    <div>
      <div class="word">Hala <span style="font-size:30px; font-weight:500; color:var(--faint);">by Khaas Hub</span></div>
      <div class="tagline">The AI Employee that answers <span class="accent">every call, message and enquiry</span> — on the first ring.</div>
    </div>
  </div>
  <div style="margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; gap:14px;">
    <div class="live" style="font-size:19px;"><span class="dot" style="width:13px;height:13px;"></span> Answering now</div>
    <div class="url" style="font-family:var(--mono); font-size:20px; letter-spacing:0.08em; color:var(--faint);">hala.khaashub.com</div>
  </div>
</div>
</body></html>
