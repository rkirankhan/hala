<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hala">
  <title>Hala</title>
  <!-- Small-size cut of the mark (below 24px): heavier stroke and a larger dot,
       and the ring brightened to #8E9BFF — at favicon sizes the standard weight
       thins out and the gap closes up. -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#8E9BFF" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="94 31" transform="rotate(135 32 32)"/>
  <circle cx="17.9" cy="46.1" r="7.5" fill="#3ECF8E"/>
</svg>
